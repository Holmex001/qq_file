# ===================================================================
# Codex CLI 配置文件
#
# 存放位置：
#   macOS / Linux : ~/.codex/config.toml
#   Windows       : C:\Users\<你的用户名>\.codex\config.toml
#
# 保存即生效（下次启动 codex 时读取）。没写的项都用默认值，
# 想恢复默认直接删掉对应行即可。
#
# 登录方式（二选一）：
#   1. ChatGPT 账号：运行 codex 后选 "Sign in with ChatGPT"（不用配 key）
#   2. API key：设置环境变量 OPENAI_API_KEY
# ===================================================================

# ---------------- 模型 ----------------
# 默认模型。codex 专用模型如 "gpt-5.2-codex"，通用模型如 "gpt-5.5"
model = "gpt-5.2-codex"

# 推理强度：minimal | low | medium | high | xhigh
# 日常 medium 够用；啃硬骨头时改 high / xhigh（更慢更贵）
model_reasoning_effort = "medium"

# 回答详略：low | medium | high
model_verbosity = "medium"

# ---------------- 执行权限 ----------------
# 审批策略（什么时候停下来问你）：
#   untrusted   - 只对不受信任的命令要求确认（默认）
#   on-failure  - 命令失败时才问
#   on-request  - 模型觉得需要时才问
#   never       - 从不问，全自动（危险）
approval_policy = "on-request"

# 沙盒模式（允许动哪些文件/命令）：
#   read-only          - 只读：不能写文件、不能执行命令
#   workspace-write    - 只能读写当前工作区，超出范围要审批
#   danger-full-access - 无限制；不要和 approval_policy = "never" 组合用
sandbox_mode = "workspace-write"

# workspace-write 沙盒下是否允许出站网络
[sandbox_workspace_write]
network_access = false

# ---------------- 历史与工具 ----------------
[history]
# save-all 保存全部会话历史；none 不保存
persistence = "save-all"

[tools]
# 原生联网搜索工具
web_search = true

# ---------------- 预设方案（可选） ----------------
# 用法：codex -p max "重构这个模块"  /  codex -p fast "修个小 bug"
[profiles.max]
model = "gpt-5.2-codex"
model_verbosity = "high"
model_reasoning_effort = "xhigh"

[profiles.fast]
model = "gpt-5.1-codex-mini"
model_verbosity = "low"
model_reasoning_effort = "low"

# ---------------- 信任的项目目录（可选） ----------------
# 把常用目录标为信任，减少审批打断。路径按你的系统写。
# [projects."D:/code/myproject"]
# trust_level = "trusted"

# ---------------- 自定义模型供应商（可选） ----------------
# 走第三方 OpenAI 兼容中转接口时用。key 走环境变量，不要明文写进文件。
# [model_providers.myproxy]
# name     = "My Proxy"
# base_url = "https://api.example.com/v1"
# env_key  = "MYPROXY_API_KEY"
# wire_api = "responses"   # responses 或 chat，按接口文档选
# 启用：取消上面注释后，在文件顶部加一行：
# model_provider = "myproxy"

# ---------------- MCP 服务（可选） ----------------
# 给 codex 接外部工具。推荐用 `codex mcp add` 命令添加，下面是手写示例：
# [mcp_servers.context7]
# command = "npx"
# args    = ["-y", "@upstash/context7-mcp"]
# enabled = true
